<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo</title>
  <!-- https://bilibili.github.io/flv.js/ -->
  <script src="https://cdn.bootcdn.net/ajax/libs/flv.js/1.6.2/flv.min.js"></script>
  <style>
      body {
          margin: 0;
      }

      .container {
          display: flex;
          justify-content: flex-start;
          align-items: flex-start;
          gap: 10px;
      }

      .video {
          width: 500px;
          height: 300px;
          background: #222;
      }
  </style>
</head>
<body>
<div class="container">
  <video class="video" id="video1" src="" muted autoplay="autoplay" controls></video>
  <video class="video" id="video2" src="" muted autoplay="autoplay" controls></video>
</div>
<script>
function initVideo1() {
  const videoElement1 = document.getElementById('video1');
  const flvPlayer = flvjs.createPlayer({
    type: 'flv',
    url: 'http://10.194.80.163:8080/live/1001.flv?token=123'
  });
  flvPlayer.attachMediaElement(videoElement1);
  flvPlayer.load();
  flvPlayer.play();
}

function initVideo2(){
  const videoElement1 = document.getElementById('video2');
  const flvPlayer = flvjs.createPlayer({
    type: 'flv',
    url: 'http://10.194.80.163:8080/live/1002.flv?token=123'
  });
  flvPlayer.attachMediaElement(videoElement1);
  flvPlayer.load();
  flvPlayer.play();
 }

initVideo1()
initVideo2()
</script>
</body>
</html>
